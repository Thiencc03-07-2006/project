<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add new food</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/ingredientAddFood.css" />
    <link
      rel="icon"
      type="image/x-icon"
      href="../assets/images/nutrium-favicon.ico"
    />
  </head>
  <body>
    <header>
      <p>Add new food</p>
      <p>Fill in the fields below with the food information</p>
    </header>
    <main>
      <div class="box-1">
        <div class="row">
          <div>
            <label for="">Name</label><input type="text" class="name" />
          </div>
          <div><label for="">Source</label><span id="nowUsername"></span></div>
        </div>
        <div class="row">
          <div>
            <label for="">Category</label>
            <select
              class="category"
              name=""
              id=""
              multiple
              onclick="openSelect()"
            >
              <option value="bug1">Select the food group</option>
              <option value="Vegetables and Vegetable Products">
                Vegetables and Vegetable Products
              </option>
              <option value="Vegetarian dishes">Vegetarian dishes</option>
              <option value="Lean & Green">Lean & Green</option>
              <option value="Low Added Sugar">Low Added Sugar</option>
              <option value="Diabetic Friendly">Diabetic Friendly</option>
              <option value="HBP Friendly">HBP Friendly</option>
              <option value="Breakfast and snacks">Breakfast and snacks</option>
              <option value="Desserts">Desserts</option>
              <option value="Chicken Dishes">Chicken Dishes</option>
              <option value="Salads">Salads</option>
              <option value="Meat dishes">Meat dishes</option>
            </select>
          </div>
          <div>
            <label for="">Quantity</label>
            <div><span>100</span><span>grams</span></div>
          </div>
        </div>
        <div class="title">Nutritional value per 100 g</div>
      </div>
      <p class="h2">Macronutrients</p>
      <div class="box-2">
        <div class="row">
          <div class="col">
            <label for="">Energy</label
            ><input class="energy" type="number" step="any" min="0" /><span
              >kcal</span
            >
          </div>
          <div class="col">
            <label for="">Fat</label
            ><input class="fat" type="number" step="any" min="0" /><span
              >g</span
            >
          </div>
        </div>
        <div class="row">
          <div class="col">
            <label for="">Carbohydrate</label
            ><input class="carbohydrate" type="number" step="any" min="0" />
            <span>g</span>
          </div>
          <div class="col">
            <label for="">Protein</label
            ><input class="protein" type="number" step="any" min="0" /><span
              >g</span
            >
          </div>
        </div>
      </div>
      <div class="h2">Micronutrients</div>
      <div class="box-3">
        <div class="row">
          <div class="col">
            <label for="">Cholestrol</label
            ><input type="number" step="any" min="0" class="cholestrol" /><span
              >mg</span
            >
          </div>
          <div class="col">
            <label for="">Fiber</label
            ><input type="number" step="any" min="0" class="fiber" /><span
              >g</span
            >
          </div>
          <div class="col">
            <label for="">Sodium</label
            ><input type="number" step="any" min="0" class="sodium" /><span
              >mg</span
            >
          </div>
        </div>
        <div class="row">
          <div class="col">
            <label for="">Water</label
            ><input type="number" step="any" min="0" class="water" /><span
              >g</span
            >
          </div>
          <div class="col">
            <label for="">Vitamin A</label
            ><input type="number" step="any" min="0" class="vitamin-a" /><span
              >ug</span
            >
          </div>
          <div class="col">
            <label for="">Vitamin B-6</label
            ><input type="number" step="any" min="0" class="vitamin-b-6" /><span
              >mg</span
            >
          </div>
        </div>
        <div class="row">
          <div class="col">
            <label for="">Vitamin B-12</label
            ><input
              type="number"
              step="any"
              min="0"
              class="vitamin-b-12"
            /><span>ug</span>
          </div>
          <div class="col">
            <label for="">Vitamin C</label
            ><input type="number" step="any" min="0" class="vitamin-c" /><span
              >mg</span
            >
          </div>
          <div class="col">
            <label for="">Vitamin D (D2 + D3)</label
            ><input
              type="number"
              step="any"
              min="0"
              class="vitamin-d-d2-d3"
            /><span>ug</span>
          </div>
        </div>
        <div class="row">
          <div class="col">
            <label for="">Vitamin E</label
            ><input type="number" step="any" min="0" class="vitamin-e" /><span
              >mg</span
            >
          </div>
          <div class="col">
            <label for="">Vitamin K</label
            ><input type="number" step="any" min="0" class="vitamin-k" /><span
              >ug</span
            >
          </div>
          <div class="col">
            <label for="">Starch</label
            ><input type="number" step="any" min="0" class="starch" /><span
              >g</span
            >
          </div>
        </div>
        <div class="row">
          <div class="col">
            <label for="">Lactose</label
            ><input type="number" step="any" min="0" class="lactose" /><span
              >g</span
            >
          </div>
          <div class="col">
            <label for="">Alcohol</label
            ><input type="number" step="any" min="0" class="alcohol" /><span
              >g</span
            >
          </div>
          <div class="col">
            <label for="">Caffeine</label
            ><input type="number" step="any" min="0" class="caffeine" /><span
              >mg</span
            >
          </div>
        </div>
        <div class="row">
          <div class="col">
            <label for="">Sugars</label
            ><input type="number" step="any" min="0" class="sugars" /><span
              >g</span
            >
          </div>
          <div class="col">
            <label for="">Calcium</label
            ><input type="number" step="any" min="0" class="calcium" /><span
              >mg</span
            >
          </div>
          <div class="col">
            <label for="">Iron</label
            ><input type="number" step="any" min="0" class="iron" /><span
              >mg</span
            >
          </div>
        </div>
        <div class="row">
          <div class="col">
            <label for="">Magnesium</label
            ><input type="number" step="any" min="0" class="magnesium" /><span
              >mg</span
            >
          </div>
          <div class="col">
            <label for="">Phosphorus</label
            ><input type="number" step="any" min="0" class="phosphorus" /><span
              >mg</span
            >
          </div>
          <div class="col">
            <label for="">Potassium</label
            ><input type="number" step="any" min="0" class="potassium" /><span
              >mg</span
            >
          </div>
        </div>
        <div class="row">
          <div class="col">
            <label for="">Zinc</label
            ><input type="number" step="any" min="0" class="zinc" /><span
              >mg</span
            >
          </div>
          <div class="col">
            <label for="">Copper</label
            ><input type="number" step="any" min="0" class="copper" /><span
              >mg</span
            >
          </div>
          <div class="col">
            <label for="">Fluoride</label
            ><input type="number" step="any" min="0" class="fluoride" /><span
              >ug</span
            >
          </div>
        </div>
        <div class="row">
          <div class="col">
            <label for="">Manganese</label
            ><input type="number" step="any" min="0" class="manganese" /><span
              >mg</span
            >
          </div>
          <div class="col">
            <label for="">Selenium</label
            ><input type="number" step="any" min="0" class="selenium" /><span
              >g</span
            >
          </div>
          <div class="col">
            <label for="">Thiamin</label
            ><input type="number" step="any" min="0" class="thiamin" /><span
              >mg</span
            >
          </div>
        </div>
        <div class="row">
          <div class="col">
            <label for="">Riboflavin</label
            ><input type="number" step="any" min="0" class="riboflavin" /><span
              >mg</span
            >
          </div>
          <div class="col">
            <label for="">Niacin</label
            ><input type="number" step="any" min="0" class="niacin" /><span
              >mg</span
            >
          </div>
          <div class="col">
            <label for="">Pantothenic acit</label
            ><input
              type="number"
              step="any"
              min="0"
              class="pantothenic-acid"
            /><span>mg</span>
          </div>
        </div>
        <div class="row">
          <div class="col">
            <label for="">Folate, total</label
            ><input
              type="number"
              step="any"
              min="0"
              class="folate-total"
            /><span>ug</span>
          </div>
          <div class="col">
            <label for="">Folic acid</label
            ><input type="number" step="any" min="0" class="folic-acid" /><span
              >ug</span
            >
          </div>
          <div class="col">
            <label for="">Fatty acids, total trans</label
            ><input
              type="number"
              step="any"
              min="0"
              class="fatty-acids-total-trans"
            /><span>g</span>
          </div>
        </div>
        <div class="row">
          <div class="col">
            <label for="">Fatty acids, total saturated</label
            ><input
              type="number"
              step="any"
              min="0"
              class="fatty-acids-total-saturated"
            /><span>g</span>
          </div>
          <div class="col">
            <label for="">Fatty acids, total monounsaturated</label
            ><input
              type="number"
              step="any"
              min="0"
              class="fatty-acids-total-monounsaturated"
            /><span>g</span>
          </div>
          <div class="col">
            <label for="">Fatty acids, total polyunsaturated</label
            ><input
              type="number"
              step="any"
              min="0"
              class="fatty-acids-total-polyunsaturated"
            /><span>g</span>
          </div>
        </div>
        <div class="row">
          <div class="col">
            <label for="">Chloride</label
            ><input type="number" step="any" min="0" class="chloride" /><span
              >mg</span
            >
          </div>
        </div>
      </div>
    </main>
    <footer>
      <button onclick="location.href=`./ingredient.html`">Cancel</button
      ><button onclick="addFood()">Save and close</button>
    </footer>
    <button class="close" onclick="location.href=`./ingredient.html`">×</button>
    <script src="../js/index.js"></script>
    <script src="../js/ingredientAddFood.js"></script>
  </body>
</html>
